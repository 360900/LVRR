name: CI

on:
  workflow_dispatch:
    inputs:
      forceContainerBuild:
        description: "Force rebuild of ubuntu container"
        type: boolean
        required: false
  push:
    branches: [ "main", "release-ci" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UBUNTU_DOCKERFILE: .github/workflows/ubuntu.dockerfile

permissions:
  contents: read
  packages: read

jobs:
  check-should-build-container:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: .github
      - id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: ${{ env.UBUNTU_DOCKERFILE }}
      - id: name
        run: echo "container_path=${{ env.REGISTRY }}/${GITHUB_REPOSITORY@L}" >> "$GITHUB_OUTPUT"
    outputs:
      should-build: ${{ steps.changed.outputs.any_changed }}
      container-path: ${{ steps.name.outputs.container_path }}

  ubuntu-build:
    runs-on: ubuntu-latest
    needs: check-should-build-container
    if: ${{ needs.check-should-build-container.outputs.should-build == 'true' || inputs.forceContainerBuild }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      # build runs in the pushed image, and a fork's token can't push it.
      - if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::Can't push the changed container image from a fork to build in it."
          exit 1
      # :latest is what main and releases build in, so other refs push their
      # own tag.
      - id: image
        env:
          CONTAINER_PATH: ${{ needs.check-should-build-container.outputs.container-path }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then tag=latest; else tag="sha-$GITHUB_SHA"; fi
          echo "image=$CONTAINER_PATH-ubuntu:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          file: ${{ env.UBUNTU_DOCKERFILE }}
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: [ubuntu-build, check-should-build-container]
    if: ${{ always() && (needs.ubuntu-build.result == 'success' || needs.ubuntu-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    container:
      # The image ubuntu-build just pushed, if it ran.
      image: ${{ needs.ubuntu-build.outputs.image || format('{0}-ubuntu:latest', needs.check-should-build-container.outputs.container-path) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: ./.github/actions/build
    - uses: ./.github/actions/check
    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: xrizer-edge-nightly-release
        path: out
    # After Upload, as the shipped build doesn't use 1.88.
    - name: MSRV check
      run: |
        rustup toolchain install 1.88 --profile minimal
        cargo +1.88 check --workspace --all-targets --locked --features static-openxr
