name: CI

# Markdown alone doesn't run CI, except docs/dbus.md, whose config table
# lvrr-common's tests check.
on:
  push:
    branches: [main]
    paths: ['**', '!**.md', 'docs/dbus.md']
  pull_request:
    paths: ['**', '!**.md', 'docs/dbus.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Job names must not be make_release or build_appimage, which wayvr's build.rs
# adds to its version.
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      # Checkout needs git to clone with history, and the PKGBUILD's lib32
      # dependencies need multilib.
      - name: Install git
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The container runs as root on a checkout owned by the runner user, so
      # git (and the versions WiVRn and wayvr take from it) would fail.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The package's own dependencies, so CI fails when the PKGBUILD lacks one.
      - name: Install dependencies
        shell: bash
        run: |
          source packaging/arch/PKGBUILD
          pacman -S --noconfirm --needed "${makedepends[@]}" "${depends[@]}"
      - name: Install Rust
        run: rustup toolchain install
      # No listed target dir may contain another: rust-cache would strip the
      # inner one down to the outer workspace's dependencies. So the root
      # workspace (lvrr, xtask) isn't listed; it rebuilds in under a minute.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            xrizer -> ../target/xrizer
            wayvr -> ../target/wayvr
      - name: Build
        id: build
        run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: lvrr-linux-x86_64
          path: target/dist/*.tar.gz
      - name: Test LVRR server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: target/wivrn/server/lvrr-test
      - name: Test wayvr
        if: ${{ !cancelled() }}
        working-directory: wayvr
        env:
          CARGO_TARGET_DIR: ../target/wayvr
        run: cargo test --workspace --locked --release
      # Here rather than in Lint for the packages lvrr-ui's dependencies need.
      # Only LVRR's crates: upstream wayvr code isn't clippy-clean. In release,
      # so it reuses Build's build scripts and proc macros instead of caching
      # a second, dev-profile tree.
      - name: Lint LVRR's wayvr crates
        if: ${{ !cancelled() }}
        working-directory: wayvr
        env:
          CARGO_TARGET_DIR: ../target/wayvr
        run: cargo clippy --locked --release -p lvrr-common -p lvrr-ui --all-targets --no-deps -- -D warnings

  # Its own job, so a lint failure doesn't skip the build and the tests.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git rustup dbus
      - uses: actions/checkout@v6
      # As in the Linux job; rebrand --check runs git.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # One step per check, so a failing one doesn't hide the others.
      - name: Format
        run: cargo fmt --check
      - name: Format wayvr
        if: ${{ !cancelled() }}
        run: cargo fmt --check --all --manifest-path wayvr/Cargo.toml
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p lvrr -p xtask --all-targets -- -D warnings
      - name: Rebrand check
        if: ${{ !cancelled() }}
        run: cargo xtask rebrand --check
      # Here, where rust-cache keeps the root workspace's build.
      - name: Test lvrr and xtask
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked

  android:
    name: Android (${{ matrix.type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [release, debug]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          key: gradle-${{ hashFiles('wivrn/gradle/wrapper/gradle-wrapper.properties', 'wivrn/build.gradle') }}
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          restore-keys: gradle-
      - uses: actions/cache@v5
        with:
          key: android-fetch-${{ matrix.type }}-${{ hashFiles('wivrn/CMakeLists.txt') }}
          path: |
            target/android-fetch/*-subbuild/*-populate-prefix/src/*.tar.*
            target/android-fetch/*-subbuild/*-populate-prefix/src/*.zip
            target/android-fetch/*.tar.*
            target/android-fetch/*.zip
            target/android-fetch/*.tgz
          restore-keys: android-fetch-${{ matrix.type }}-
      # Same as WiVRn's own Android job.
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools librsvg2-bin gettext
          wget -q https://github.com/KhronosGroup/KTX-Software/releases/download/v4.3.2/KTX-Software-4.3.2-Linux-x86_64.deb
          sudo dpkg --install KTX-Software-4.3.2-Linux-x86_64.deb
          rm KTX-Software-4.3.2-Linux-x86_64.deb
          npm install --global @gltf-transform/cli
      - name: Install Rust
        run: rustup toolchain install
      - name: Signing key
        if: matrix.type == 'release'
        env:
          APK_SIGNINGKEYPASSWORD: ${{ secrets.APK_SIGNINGKEYPASSWORD }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$APK_SIGNINGKEYPASSWORD" ] && [ -n "$APK_KEYSTORE_BASE64" ]; then
            echo signingKeyPassword="$APK_SIGNINGKEYPASSWORD" > wivrn/gradle.properties
            echo "$APK_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > wivrn/ks.keystore
          else
            echo "No signing secrets, the release APK will be unsigned"
          fi
      # One debug key for every run, so a newer debug APK installs over an
      # older one. The secret is a base64 debug.keystore with AGP's defaults
      # (store and key password android, alias androiddebugkey).
      - name: Debug signing key
        if: matrix.type == 'debug'
        env:
          APK_DEBUG_KEYSTORE_BASE64: ${{ secrets.APK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$APK_DEBUG_KEYSTORE_BASE64" ]; then
            dir="${ANDROID_USER_HOME:-$HOME/.android}"
            mkdir -p "$dir"
            echo "$APK_DEBUG_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$dir/debug.keystore"
          else
            echo "No debug keystore secret, the debug APK gets a new signing key"
          fi
      - name: Build
        run: cargo xtask apk ${{ matrix.type == 'debug' && '--debug' || '' }} -- -Pwivrn_compress_glb=ON
      - uses: actions/upload-artifact@v7
        with:
          name: lvrr-apk-${{ matrix.type }}
          path: target/dist/*.apk
