[package]
name = "lvrr-ui"
version = "0.1.0"
edition = "2024"
description = "LVRR's desktop window: pairing, headset and server settings"
license = "GPL-3.0-only"
repository = "https://github.com/360900/LVRR"

[dependencies]
dash-frontend = { path = "../dash-frontend/" }
lvrr-common = { path = "../lvrr-common", features = ["dbus"] }
wayvr-ipc = { path = "../wayvr-ipc", default-features = false }
wgui = { path = "../wgui/" }
wlx-common = { path = "../wlx-common" }

anyhow.workspace = true
dbus.workspace = true
glam.workspace = true
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
log.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
wayland-client = { workspace = true, features = ["system"] }
wayland-protocols = { workspace = true, features = ["client", "staging"] }
winit.workspace = true
