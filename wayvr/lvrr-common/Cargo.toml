[package]
name = "lvrr-common"
version = "0.1.0"
edition = "2024"
description = "LVRR integration shared by the WayVR crates"
license = "GPL-3.0-only"
repository = "https://github.com/360900/LVRR"

[dependencies]
anyhow.workspace = true
dbus = { workspace = true, optional = true }
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
# Talk to the LVRR server; without it only the emulator is available
dbus = ["dep:dbus"]

[[example]]
name = "lvrr_probe"
required-features = ["dbus"]
