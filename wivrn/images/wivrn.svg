<?xml version="1.0" encoding="UTF-8"?>
<!-- LVRR logo: the dashboard's home button, lvrr-mono.svg on its circle. Also installed as
     wivrn/images/wivrn*.svg by `cargo xtask rebrand`. WiVRn's build stylesheets tint #wivrn
     through the filters below, which do nothing here, so every build shows the same logo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <title>LVRR</title>
  <defs>
    <linearGradient id="lvrr-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23a9f6"/>
      <stop offset="1" stop-color="#1a8bcf"/>
    </linearGradient>
    <filter id="filter60"><feColorMatrix type="hueRotate" values="0"/></filter>
    <filter id="blue-tint"><feColorMatrix type="hueRotate" values="0"/></filter>
  </defs>
  <g id="night-sky" style="display:none"/>
  <g id="wivrn">
    <circle cx="90" cy="90" r="86" fill="url(#lvrr-fill)"/>
    <circle cx="90" cy="90" r="84" fill="none" stroke="#0e5f8e" stroke-width="4"/>
    <g transform="translate(90 90) scale(3.6) translate(-15 -15)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M7,4.5 V13.5 H13"/>
      <path d="M16,4.5 L19.5,13.5 L23,4.5"/>
      <path d="M7,25.5 V16.5 H11 A2.7,2.7 0 0 1 11,21.9 H7 M10.5,21.9 L13.5,25.5"/>
      <path d="M16.5,25.5 V16.5 H20.5 A2.7,2.7 0 0 1 20.5,21.9 H16.5 M20,21.9 L23,25.5"/>
    </g>
  </g>
</svg>
